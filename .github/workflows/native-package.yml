name: Native package compatibility

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "source/**"
      - "test/consumer/**"
      - "vcpkg/**"
      - ".github/workflows/native-package.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  installed-sdk:
    name: Installed SDK (${{ matrix.triplet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      IOX_VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      ILIC_VERSION: 0.10.0-snapshot.475ecb2d
      VCPKG_BUILTIN_BASELINE: d015e31e90838a4c9dfa3eed45979bc70d9357fc
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_FEED_URL: https://nuget.pkg.github.com/edigonzales/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/edigonzales/index.json,read
      VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_BASEDIRS: ${{ github.workspace }}

    steps:
      - name: Check out iox-cpp
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg
          persist-credentials: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Restore sccache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v1-package-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            sccache-v1-package-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Mono for NuGet (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes mono-complete
          fi

      - name: Install Mono for NuGet (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            brew install mono
          fi

      - name: Prepare vcpkg downloads directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p "$VCPKG_DOWNLOADS"

      - name: Prepare vcpkg downloads directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: '"$IOX_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:IOX_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Resolve ilic registry baseline (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git ls-remote https://github.com/edigonzales/ilic-fork.git refs/heads/vcpkg-registry | awk '{print $1}')"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve ilic vcpkg registry baseline" >&2
            exit 1
          fi
          echo "ILIC_REGISTRY_BASELINE=$baseline" >> "$GITHUB_ENV"

      - name: Resolve ilic registry baseline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = git ls-remote https://github.com/edigonzales/ilic-fork.git refs/heads/vcpkg-registry
          $baseline = ($line -split '\s+')[0]
          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve ilic vcpkg registry baseline'
          }
          "ILIC_REGISTRY_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure dependency manifest (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          manifest_root="$GITHUB_WORKSPACE/build/sdk-deps"
          mkdir -p "$manifest_root"
          cat > "$manifest_root/vcpkg.json" <<EOF
          {
            "name": "iox-sdk-dependencies",
            "version-string": "0",
            "dependencies": ["expat", "ilic"],
            "overrides": [
              {
                "name": "ilic",
                "version-string": "$ILIC_VERSION"
              }
            ]
          }
          EOF
          cat > "$manifest_root/vcpkg-configuration.json" <<EOF
          {
            "default-registry": {
              "kind": "builtin",
              "baseline": "$VCPKG_BUILTIN_BASELINE"
            },
            "registries": [
              {
                "kind": "git",
                "repository": "https://github.com/edigonzales/ilic-fork.git",
                "reference": "vcpkg-registry",
                "baseline": "$ILIC_REGISTRY_BASELINE",
                "packages": ["ilic"]
              }
            ]
          }
          EOF

      - name: Configure dependency manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE 'build\sdk-deps'
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          $manifest = @{
            name = 'iox-sdk-dependencies'
            'version-string' = '0'
            dependencies = @('expat', 'ilic')
            overrides = @(
              @{
                name = 'ilic'
                'version-string' = $env:ILIC_VERSION
              }
            )
          }
          $configuration = @{
            'default-registry' = @{
              kind = 'builtin'
              baseline = $env:VCPKG_BUILTIN_BASELINE
            }
            registries = @(
              @{
                kind = 'git'
                repository = 'https://github.com/edigonzales/ilic-fork.git'
                reference = 'vcpkg-registry'
                baseline = $env:ILIC_REGISTRY_BASELINE
                packages = @('ilic')
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $manifestRoot 'vcpkg.json')
          $configuration | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $manifestRoot 'vcpkg-configuration.json')

      - name: Authenticate GitHub Packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NUGET_PATH="$("$IOX_VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)"
          mono "$NUGET_PATH" sources add \
            -Source "$VCPKG_FEED_URL" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "$GITHUB_ACTOR" \
            -Password "$VCPKG_GITHUB_TOKEN"

      - name: Authenticate GitHub Packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nuget = (& "$env:IOX_VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:VCPKG_FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:GITHUB_ACTOR" `
            -Password "$env:VCPKG_GITHUB_TOKEN"

      - name: Install native SDK dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build/sdk-deps"
          "$IOX_VCPKG_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET"

      - name: Install native SDK dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'build\sdk-deps')
          try {
            & "$env:IOX_VCPKG_ROOT\vcpkg.exe" install "--triplet=$env:VCPKG_TRIPLET"
          } finally {
            Pop-Location
          }

      - name: Configure installable iox SDK
        run: >-
          cmake -S . -B build/package -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          -DCMAKE_INSTALL_LIBDIR=lib
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_TOOLCHAIN_FILE=${{ env.IOX_VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_MODE=OFF
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/sdk-deps/vcpkg_installed
          -DBUILD_TESTING=OFF
          -DIOX_BUILD_EXAMPLES=OFF
          -DIOX_BUILD_TOOLS=OFF
          -DIOX_USE_SYSTEM_EXPAT=ON
          -DIOX_ENABLE_ILIC=ON
          -DIOX_ENABLE_INSTALL=ON

      - name: Build and install iox SDK
        run: |
          cmake --build build/package --parallel
          cmake --install build/package --prefix "${{ github.workspace }}/build/iox-prefix"

      - name: Configure clean installed-package consumer
        run: >-
          cmake -S test/consumer/installed-package -B build/package-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/iox-prefix
          -DCMAKE_TOOLCHAIN_FILE=${{ env.IOX_VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_MODE=OFF
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/sdk-deps/vcpkg_installed
          -DIOX_CONSUMER_REQUIRE_ILIC=ON

      - name: Build installed-package consumer
        run: cmake --build build/package-consumer --parallel

      - name: Run installed-package consumer
        run: ctest --test-dir build/package-consumer --output-on-failure

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats
