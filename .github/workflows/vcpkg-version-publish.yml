name: Request iox-cpp vcpkg registry version

on:
  repository_dispatch:
    types: [vcpkg-release-ready]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact iox-cpp source commit
        required: true
        type: string
      release_kind:
        description: snapshot or stable
        required: true
        default: snapshot
        type: choice
        options: [snapshot, stable]
      release_tag:
        description: vX.Y.Z for stable releases, snapshot otherwise
        required: true
        default: snapshot
        type: string

permissions:
  contents: write

concurrency:
  group: iox-vcpkg-publication-request
  cancel-in-progress: false

jobs:
  request:
    name: Request and verify immutable shared registry version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release metadata
        id: release
        shell: bash
        env:
          EVENT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          EVENT_RELEASE_KIND: ${{ github.event.client_payload.release_kind }}
          EVENT_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_RELEASE_KIND: ${{ inputs.release_kind }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          source_sha=${EVENT_SOURCE_SHA:-$INPUT_SOURCE_SHA}
          release_kind=${EVENT_RELEASE_KIND:-$INPUT_RELEASE_KIND}
          release_tag=${EVENT_RELEASE_TAG:-$INPUT_RELEASE_TAG}
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$release_kind" == snapshot || "$release_kind" == stable ]] || { echo "Invalid release kind" >&2; exit 1; }
          if [[ "$release_kind" == stable ]]; then
            [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable release requires vX.Y.Z" >&2; exit 1; }
          else
            [[ "$release_tag" == snapshot ]] || { echo "Snapshot release tag must be snapshot" >&2; exit 1; }
          fi
          {
            echo "source_sha=$source_sha"
            echo "release_kind=$release_kind"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check out released iox source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve deterministic vcpkg version
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE_KIND: ${{ steps.release.outputs.release_kind }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 source/scripts/release_metadata.py --project-root source check
          if [[ "$RELEASE_KIND" == stable ]]; then
            test "$(git -C source rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
            version=$(python3 source/scripts/release_metadata.py --project-root source version --kind stable --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA")
          else
            version=$(python3 source/scripts/release_metadata.py --project-root source version --kind snapshot --source-sha "$SOURCE_SHA")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute GitHub source archive SHA512
        id: archive
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/iox-cpp-$SOURCE_SHA.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/archive/$SOURCE_SHA.tar.gz" \
            --output "$archive"
          sha512=$(sha512sum "$archive" | awk '{print $1}')
          [[ "$sha512" =~ ^[0-9a-f]{128}$ ]]
          echo "sha512=$sha512" >> "$GITHUB_OUTPUT"

      - name: Dispatch publication to the sole registry writer
        env:
          GH_TOKEN: ${{ secrets.VCPKG_REGISTRY_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          SOURCE_SHA512: ${{ steps.archive.outputs.sha512 }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg package_name iox-cpp \
            --arg version "$VERSION" \
            --arg source_sha "$SOURCE_SHA" \
            --arg sha512 "$SOURCE_SHA512" \
            '{event_type:"vcpkg-port-publication-requested",client_payload:{package_name:$package_name,version:$version,source_sha:$source_sha,sha512:$sha512,change_kind:"source"}}' |
            gh api --method POST repos/edigonzales/ilic-fork/dispatches --input -

      - name: Wait for and validate the public registry entry
        id: registry
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          SOURCE_SHA512: ${{ steps.archive.outputs.sha512 }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            rm -rf "$RUNNER_TEMP/registry"
            git clone --quiet --depth 1 --branch vcpkg-registry \
              https://github.com/edigonzales/ilic-fork.git "$RUNNER_TEMP/registry"
            version_file="$RUNNER_TEMP/registry/versions/i-/iox-cpp.json"
            if [[ -f "$version_file" ]]; then
              mapfile -t trees < <(jq -r --arg version "$VERSION" \
                '.versions[] | select(."version-string" == $version and (."port-version" // 0) == 0) | ."git-tree"' "$version_file")
              (( ${#trees[@]} <= 1 )) || { echo "Duplicate registry version" >&2; exit 1; }
              if (( ${#trees[@]} == 1 )); then
                tree=${trees[0]}
                git -C "$RUNNER_TEMP/registry" show "$tree:vcpkg.json" > "$RUNNER_TEMP/iox-vcpkg.json"
                git -C "$RUNNER_TEMP/registry" show "$tree:portfile.cmake" > "$RUNNER_TEMP/iox-portfile.cmake"
                jq -e --arg version "$VERSION" '.name == "iox-cpp" and ."version-string" == $version' "$RUNNER_TEMP/iox-vcpkg.json" >/dev/null
                grep -Fq "REF $SOURCE_SHA" "$RUNNER_TEMP/iox-portfile.cmake"
                grep -Fq "SHA512 $SOURCE_SHA512" "$RUNNER_TEMP/iox-portfile.cmake"
                baseline=$(git -C "$RUNNER_TEMP/registry" rev-parse HEAD)
                echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            [[ "$attempt" -lt 30 ]] || { echo "Registry publication did not appear" >&2; exit 1; }
            sleep 10
          done

      - name: Request same-repository binary-cache publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          REGISTRY_BASELINE: ${{ steps.registry.outputs.baseline }}
        shell: bash
        run: |
          jq -n --arg version "$VERSION" --arg source_sha "$SOURCE_SHA" --arg registry_baseline "$REGISTRY_BASELINE" \
            '{event_type:"vcpkg-version-published",client_payload:{version:$version,source_sha:$source_sha,registry_baseline:$registry_baseline}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
