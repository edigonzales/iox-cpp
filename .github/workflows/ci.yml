name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  native:
    name: Native source with cached dependencies (${{ matrix.triplet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-2022
            triplet: x64-windows
          - os: windows-2022
            triplet: x64-windows-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      VCPKG_ROOT_DIR: ${{ github.workspace }}/build/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/build/ci-deps/vcpkg_installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}/build/vcpkg-downloads
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_FEED_URL: https://nuget.pkg.github.com/edigonzales/index.json
      VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IS_EXTERNAL_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify lock and export pinned toolchain
        run: |
          python3 test/release_metadata_test.py
          python3 scripts/release_metadata.py check
          python3 scripts/release_metadata.py export-github-env
      - name: Verify runner architecture
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) test "$(uname -m)" = x86_64 ;;
            macOS) test "$(uname -m)" = arm64 ;;
            Windows) test "$(uname -m)" = x86_64 || test "${PROCESSOR_ARCHITECTURE:-}" = AMD64 ;;
          esac
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes mono-complete ninja-build
          elif [[ "$RUNNER_OS" == macOS ]]; then
            brew install mono ninja
          fi
      - name: Check out and bootstrap locked vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$IOX_VCPKG_REF" https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT_DIR"
          python3 -c 'import os, pathlib; pathlib.Path(os.environ["VCPKG_DOWNLOADS"]).mkdir(parents=True, exist_ok=True)'
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$VCPKG_ROOT_DIR/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Authenticate binary cache
        if: env.IS_EXTERNAL_FORK != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            nuget_path=$("$VCPKG_ROOT_DIR/vcpkg.exe" fetch nuget | tail -n 1)
            "$nuget_path" sources add -Source "$VCPKG_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$GITHUB_ACTOR" -Password "$VCPKG_GITHUB_TOKEN"
          else
            nuget_path=$("$VCPKG_ROOT_DIR/vcpkg" fetch nuget | tail -n 1)
            mono "$nuget_path" sources add -Source "$VCPKG_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$GITHUB_ACTOR" -Password "$VCPKG_GITHUB_TOKEN"
          fi
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          command="$VCPKG_ROOT_DIR/vcpkg"
          [[ "$RUNNER_OS" == Windows ]] && command="$VCPKG_ROOT_DIR/vcpkg.exe"
          extra=()
          if [[ "$IS_EXTERNAL_FORK" == true ]]; then
            export VCPKG_BINARY_SOURCES=clear
            echo "External fork: source fallback enabled"
          else
            export VCPKG_BINARY_SOURCES="clear;nuget,$VCPKG_FEED_URL,read"
            extra+=(--only-binarycaching)
          fi
          "$command" install \
            --x-manifest-root="$GITHUB_WORKSPACE/release/vcpkg-dependencies" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --downloads-root="$VCPKG_DOWNLOADS" \
            --triplet="${{ matrix.triplet }}" "${extra[@]}"
      - name: Configure iox source against installed dependencies
        shell: bash
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH="$VCPKG_INSTALLED_DIR/${{ matrix.triplet }}"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_MODE=OFF
          -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"
          ${{ matrix.triplet == 'x64-windows-static' && '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' || '' }}
          -DBUILD_TESTING=ON
          -DIOX_BUILD_EXAMPLES=ON
          -DIOX_USE_SYSTEM_EXPAT=ON
          -DIOX_USE_SYSTEM_YYJSON=ON
          -DIOX_ENABLE_ILIC=ON
          -DIOX_FETCH_ILIC=OFF
          -DIOX_ILIC_VERSION="$IOX_ILIC_RUNTIME_VERSION"
      - name: Build and test current iox source
        run: |
          cmake --build build/ci --config Release --parallel
          ctest --test-dir build/ci -C Release --output-on-failure

  stable-ilic-contract:
    name: Stable ilic source contract
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build
      - name: Build against the documented stable ilic tag
        run: |
          cmake -S . -B build/stable-ilic -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DIOX_ENABLE_ILIC=ON -DIOX_FETCH_ILIC=ON \
            -DIOX_ILIC_VERSION=0.9.10 -DIOX_ILIC_GIT_TAG=v0.9.10
          cmake --build build/stable-ilic --parallel
          ctest --test-dir build/stable-ilic --output-on-failure

  wasm:
    name: WebAssembly package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          emscripten_version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten_version"
      - name: Build WASM package
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
          npm test --prefix packages/iox-wasm
      - name: Verify package contents
        run: |
          test -s packages/iox-wasm/iox-wasm.mjs
          test -s packages/iox-wasm/iox-wasm.wasm
          node --check packages/iox-wasm/index.js
