name: vcpkg overlay compatibility 0.2

on:
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "source/**"
      - "test/consumer/**"
      - "vcpkg/**"
      - "scripts/prepare-vcpkg-registry-port.mjs"
      - ".github/workflows/vcpkg-overlay-02.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  overlay:
    name: iox-cpp[ilic] (${{ matrix.triplet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-2022
            triplet: x64-windows
          - os: windows-2022
            triplet: x64-windows-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      IOX_VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      ILIC_VERSION: 0.10.0-snapshot.cd74490b
      VCPKG_BUILTIN_BASELINE: d015e31e90838a4c9dfa3eed45979bc70d9357fc
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_FEED_URL: https://nuget.pkg.github.com/edigonzales/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/edigonzales/index.json,read
      VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Mono for NuGet
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get update && sudo apt-get install --yes mono-complete
            else
              brew install mono
            fi
          fi

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          "$IOX_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
          & "$env:IOX_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Render current iox overlay port (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          base_version=$(sed -nE 's/.*project\(iox-cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          version="$base_version-snapshot.${source_sha:0:8}"
          archive="$RUNNER_TEMP/iox-cpp-$source_sha.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/archive/$source_sha.tar.gz" \
            --output "$archive"
          sha512=$(sha512sum "$archive" | awk '{print $1}')
          node scripts/prepare-vcpkg-registry-port.mjs \
            --template-dir vcpkg/ports/iox-cpp \
            --output-dir "$GITHUB_WORKSPACE/build/current-overlay/iox-cpp" \
            --version "$version" \
            --source-sha "$source_sha" \
            --sha512 "$sha512"
          echo "IOX_OVERLAY_PORTS=$GITHUB_WORKSPACE/build/current-overlay" >> "$GITHUB_ENV"

      - name: Render current iox overlay port (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $baseVersion = ((Select-String -Path CMakeLists.txt -Pattern 'project\(iox-cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1).Matches[0].Groups[1].Value)
          $version = "$baseVersion-snapshot.$($sourceSha.Substring(0, 8))"
          $archive = Join-Path $env:RUNNER_TEMP "iox-cpp-$sourceSha.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/archive/$sourceSha.tar.gz" -OutFile $archive
          $sha512 = (Get-FileHash -Path $archive -Algorithm SHA512).Hash.ToLowerInvariant()
          $overlay = Join-Path $env:GITHUB_WORKSPACE 'build\current-overlay\iox-cpp'
          node scripts/prepare-vcpkg-registry-port.mjs `
            --template-dir vcpkg/ports/iox-cpp `
            --output-dir $overlay `
            --version $version `
            --source-sha $sourceSha `
            --sha512 $sha512
          "IOX_OVERLAY_PORTS=$(Join-Path $env:GITHUB_WORKSPACE 'build\current-overlay')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve ilic registry baseline (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          baseline="$(git ls-remote https://github.com/edigonzales/ilic-fork.git refs/heads/vcpkg-registry | awk '{print $1}')"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "ILIC_REGISTRY_BASELINE=$baseline" >> "$GITHUB_ENV"

      - name: Resolve ilic registry baseline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = ((git ls-remote https://github.com/edigonzales/ilic-fork.git refs/heads/vcpkg-registry) -split '\s+')[0]
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve ilic registry baseline' }
          "ILIC_REGISTRY_BASELINE=$baseline" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure overlay manifest (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/build/vcpkg-consumer"
          mkdir -p "$root"
          cat > "$root/vcpkg.json" <<EOF
          {
            "name": "iox02-vcpkg-smoke",
            "version-string": "0",
            "dependencies": [{"name":"iox-cpp","features":["ilic"]}],
            "overrides": [{"name":"ilic","version-string":"$ILIC_VERSION"}]
          }
          EOF
          cat > "$root/vcpkg-configuration.json" <<EOF
          {
            "default-registry": {"kind":"builtin","baseline":"$VCPKG_BUILTIN_BASELINE"},
            "registries": [{
              "kind":"git",
              "repository":"https://github.com/edigonzales/ilic-fork.git",
              "reference":"vcpkg-registry",
              "baseline":"$ILIC_REGISTRY_BASELINE",
              "packages":["ilic"]
            }]
          }
          EOF

      - name: Configure overlay manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-consumer'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          @{name='iox02-vcpkg-smoke'; 'version-string'='0'; dependencies=@(@{name='iox-cpp'; features=@('ilic')}); overrides=@(@{name='ilic'; 'version-string'=$env:ILIC_VERSION})} | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $root 'vcpkg.json')
          @{'default-registry'=@{kind='builtin'; baseline=$env:VCPKG_BUILTIN_BASELINE}; registries=@(@{kind='git'; repository='https://github.com/edigonzales/ilic-fork.git'; reference='vcpkg-registry'; baseline=$env:ILIC_REGISTRY_BASELINE; packages=@('ilic')})} | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $root 'vcpkg-configuration.json')

      - name: Authenticate GitHub Packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NUGET_PATH="$("$IOX_VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)"
          mono "$NUGET_PATH" sources add -Source "$VCPKG_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$GITHUB_ACTOR" -Password "$VCPKG_GITHUB_TOKEN"

      - name: Authenticate GitHub Packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nuget = (& "$env:IOX_VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1)
          & $nuget sources add -Source "$env:VCPKG_FEED_URL" -StorePasswordInClearText -Name GitHubPackages -UserName "$env:GITHUB_ACTOR" -Password "$env:VCPKG_GITHUB_TOKEN"

      - name: Install iox-cpp through overlay (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build/vcpkg-consumer"
          "$IOX_VCPKG_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET" --overlay-ports="$IOX_OVERLAY_PORTS"

      - name: Install iox-cpp through overlay (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location "$env:GITHUB_WORKSPACE\build\vcpkg-consumer"
          try { & "$env:IOX_VCPKG_ROOT\vcpkg.exe" install "--triplet=$env:VCPKG_TRIPLET" "--overlay-ports=$env:IOX_OVERLAY_PORTS" } finally { Pop-Location }

      - name: Configure clean consumer
        run: >-
          cmake -S test/consumer/installed-package -B build/vcpkg-consumer-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.IOX_VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_MODE=OFF
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/vcpkg-consumer/vcpkg_installed
          -DIOX_CONSUMER_REQUIRE_ILIC=ON

      - run: cmake --build build/vcpkg-consumer-build --parallel
      - run: ctest --test-dir build/vcpkg-consumer-build --output-on-failure
