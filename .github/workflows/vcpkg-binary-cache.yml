name: Publish vcpkg binary cache

on:
  repository_dispatch:
    types: [vcpkg-version-published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable iox-cpp vcpkg version to publish
        required: true
        type: string
      registry_baseline:
        description: iox-cpp vcpkg-registry commit containing the version
        required: true
        type: string
      ilic_registry_baseline:
        description: ilic vcpkg-registry commit used to resolve the ilic feature dependency
        required: true
        type: string
      source_sha:
        description: Optional iox-cpp source commit for traceability
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    name: Validate publication request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      registry_baseline: ${{ steps.resolve.outputs.registry_baseline }}
      ilic_registry_baseline: ${{ steps.resolve.outputs.ilic_registry_baseline }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve and validate request
        id: resolve
        shell: bash
        env:
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          EVENT_REGISTRY_BASELINE: ${{ github.event.client_payload.registry_baseline }}
          EVENT_ILIC_REGISTRY_BASELINE: ${{ github.event.client_payload.ilic_registry_baseline }}
          EVENT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REGISTRY_BASELINE: ${{ inputs.registry_baseline }}
          INPUT_ILIC_REGISTRY_BASELINE: ${{ inputs.ilic_registry_baseline }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version=${EVENT_VERSION:-$INPUT_VERSION}
          registry_baseline=${EVENT_REGISTRY_BASELINE:-$INPUT_REGISTRY_BASELINE}
          ilic_registry_baseline=${EVENT_ILIC_REGISTRY_BASELINE:-$INPUT_ILIC_REGISTRY_BASELINE}
          source_sha=${EVENT_SOURCE_SHA:-$INPUT_SOURCE_SHA}

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
             [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-snapshot\.[0-9a-f]{8}$ ]]; then
            echo "Invalid iox-cpp vcpkg version: $version" >&2
            exit 1
          fi
          if [[ ! "$registry_baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid iox-cpp registry baseline: $registry_baseline" >&2
            exit 1
          fi
          if [[ ! "$ilic_registry_baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid ilic registry baseline: $ilic_registry_baseline" >&2
            exit 1
          fi
          if [[ -n "$source_sha" && ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry_baseline=$registry_baseline" >> "$GITHUB_OUTPUT"
          echo "ilic_registry_baseline=$ilic_registry_baseline" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Publishing iox-cpp[ilic] $version from registry $registry_baseline using ilic registry $ilic_registry_baseline"

  publish:
    name: Publish iox-cpp[ilic] (${{ matrix.triplet }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      IOX_VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg-cache
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      IOX_VERSION: ${{ needs.metadata.outputs.version }}
      IOX_REGISTRY_BASELINE: ${{ needs.metadata.outputs.registry_baseline }}
      ILIC_REGISTRY_BASELINE: ${{ needs.metadata.outputs.ilic_registry_baseline }}
      VCPKG_BUILTIN_BASELINE: d015e31e90838a4c9dfa3eed45979bc70d9357fc
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_FEED_URL: https://nuget.pkg.github.com/edigonzales/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/edigonzales/index.json,readwrite
      VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg-cache
          persist-credentials: false

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clear Visual Studio vcpkg root
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"VCPKG_ROOT=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Install Mono for NuGet (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes mono-complete
          fi

      - name: Install Mono for NuGet (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            brew install mono
          fi

      - name: Prepare vcpkg downloads directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p "$VCPKG_DOWNLOADS"

      - name: Prepare vcpkg downloads directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: '"$IOX_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:IOX_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Configure registry manifest (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          manifest_root="$GITHUB_WORKSPACE/build/vcpkg-publisher"
          mkdir -p "$manifest_root"
          cat > "$manifest_root/vcpkg.json" <<EOF
          {
            "name": "iox-cpp-binary-cache-publisher",
            "version-string": "0",
            "dependencies": [
              {
                "name": "iox-cpp",
                "features": ["ilic"]
              }
            ],
            "overrides": [
              {
                "name": "iox-cpp",
                "version-string": "$IOX_VERSION"
              }
            ]
          }
          EOF
          cat > "$manifest_root/vcpkg-configuration.json" <<EOF
          {
            "default-registry": {
              "kind": "builtin",
              "baseline": "$VCPKG_BUILTIN_BASELINE"
            },
            "registries": [
              {
                "kind": "git",
                "repository": "https://github.com/edigonzales/iox-cpp.git",
                "reference": "vcpkg-registry",
                "baseline": "$IOX_REGISTRY_BASELINE",
                "packages": ["iox-cpp"]
              },
              {
                "kind": "git",
                "repository": "https://github.com/edigonzales/ilic-fork.git",
                "reference": "vcpkg-registry",
                "baseline": "$ILIC_REGISTRY_BASELINE",
                "packages": ["ilic"]
              }
            ]
          }
          EOF

      - name: Configure registry manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-publisher'
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          $manifest = @{
            name = 'iox-cpp-binary-cache-publisher'
            'version-string' = '0'
            dependencies = @(
              @{
                name = 'iox-cpp'
                features = @('ilic')
              }
            )
            overrides = @(
              @{
                name = 'iox-cpp'
                'version-string' = $env:IOX_VERSION
              }
            )
          }
          $configuration = @{
            'default-registry' = @{
              kind = 'builtin'
              baseline = $env:VCPKG_BUILTIN_BASELINE
            }
            registries = @(
              @{
                kind = 'git'
                repository = 'https://github.com/edigonzales/iox-cpp.git'
                reference = 'vcpkg-registry'
                baseline = $env:IOX_REGISTRY_BASELINE
                packages = @('iox-cpp')
              },
              @{
                kind = 'git'
                repository = 'https://github.com/edigonzales/ilic-fork.git'
                reference = 'vcpkg-registry'
                baseline = $env:ILIC_REGISTRY_BASELINE
                packages = @('ilic')
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $manifestRoot 'vcpkg.json')
          $configuration | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $manifestRoot 'vcpkg-configuration.json')

      - name: Authenticate NuGet source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NUGET_PATH="$("$IOX_VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)"
          mono "$NUGET_PATH" sources add \
            -Source "$VCPKG_FEED_URL" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "$GITHUB_ACTOR" \
            -Password "$VCPKG_GITHUB_TOKEN"
          mono "$NUGET_PATH" setapikey "$VCPKG_GITHUB_TOKEN" \
            -Source "$VCPKG_FEED_URL"

      - name: Authenticate NuGet source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nuget = (& "$env:IOX_VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:VCPKG_FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:GITHUB_ACTOR" `
            -Password "$env:VCPKG_GITHUB_TOKEN"
          & $nuget setapikey "$env:VCPKG_GITHUB_TOKEN" `
            -Source "$env:VCPKG_FEED_URL"

      - name: Build and publish iox-cpp binary package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build/vcpkg-publisher"
          "$IOX_VCPKG_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET"

      - name: Build and publish iox-cpp binary package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-publisher')
          try {
            & "$env:IOX_VCPKG_ROOT\vcpkg.exe" install "--triplet=$env:VCPKG_TRIPLET"
          } finally {
            Pop-Location
          }

  verify-restore:
    name: Verify remote restore (x64-linux)
    needs: [metadata, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IOX_VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg-restore
      IOX_VERSION: ${{ needs.metadata.outputs.version }}
      IOX_REGISTRY_BASELINE: ${{ needs.metadata.outputs.registry_baseline }}
      ILIC_REGISTRY_BASELINE: ${{ needs.metadata.outputs.ilic_registry_baseline }}
      VCPKG_BUILTIN_BASELINE: d015e31e90838a4c9dfa3eed45979bc70d9357fc
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/restore-downloads
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_FEED_URL: https://nuget.pkg.github.com/edigonzales/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/edigonzales/index.json,read
      VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg-restore
          persist-credentials: false

      - name: Install Mono for NuGet
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes mono-complete
          fi

      - name: Prepare and bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          "$IOX_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure registry manifest
        shell: bash
        run: |
          manifest_root="$GITHUB_WORKSPACE/build/vcpkg-restore-consumer"
          mkdir -p "$manifest_root"
          cat > "$manifest_root/vcpkg.json" <<EOF
          {
            "name": "iox-cpp-binary-cache-restore",
            "version-string": "0",
            "dependencies": [
              {
                "name": "iox-cpp",
                "features": ["ilic"]
              }
            ],
            "overrides": [
              {
                "name": "iox-cpp",
                "version-string": "$IOX_VERSION"
              }
            ]
          }
          EOF
          cat > "$manifest_root/vcpkg-configuration.json" <<EOF
          {
            "default-registry": {
              "kind": "builtin",
              "baseline": "$VCPKG_BUILTIN_BASELINE"
            },
            "registries": [
              {
                "kind": "git",
                "repository": "https://github.com/edigonzales/iox-cpp.git",
                "reference": "vcpkg-registry",
                "baseline": "$IOX_REGISTRY_BASELINE",
                "packages": ["iox-cpp"]
              },
              {
                "kind": "git",
                "repository": "https://github.com/edigonzales/ilic-fork.git",
                "reference": "vcpkg-registry",
                "baseline": "$ILIC_REGISTRY_BASELINE",
                "packages": ["ilic"]
              }
            ]
          }
          EOF

      - name: Authenticate NuGet source
        shell: bash
        run: |
          NUGET_PATH="$("$IOX_VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)"
          mono "$NUGET_PATH" sources add \
            -Source "$VCPKG_FEED_URL" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "$GITHUB_ACTOR" \
            -Password "$VCPKG_GITHUB_TOKEN"

      - name: Restore iox-cpp from GitHub Packages without building
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build/vcpkg-restore-consumer"
          "$IOX_VCPKG_ROOT/vcpkg" install --triplet x64-linux --only-binarycaching
