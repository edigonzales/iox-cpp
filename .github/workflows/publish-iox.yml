name: Publish iox-cpp

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-iox
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable release contract
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.contract.outputs.source_sha }}
      channel: ${{ steps.contract.outputs.channel }}
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve release contract from tag or manual snapshot
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_metadata.py check
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable release requires vX.Y.Z" >&2; exit 1; }
            [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" == "$source_sha" ]] || { echo "Tag does not point at checkout" >&2; exit 1; }
            channel=stable
            tag=$GITHUB_REF_NAME
            version=$(python3 scripts/release_metadata.py version --kind stable --tag "$tag" --source-sha "$source_sha")
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Snapshots may only be dispatched from main" >&2; exit 1; }
            channel=snapshot
            tag=""
            version=$(python3 scripts/release_metadata.py version --kind snapshot --source-sha "$source_sha")
          fi
          {
            echo "source_sha=$source_sha"
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify source/WASM artifacts
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          emscripten_version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten_version"
      - name: Build and test WASM package
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
          npm test --prefix packages/iox-wasm
      - name: Stage package with deterministic provenance
        shell: bash
        run: |
          set -euo pipefail
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/release_metadata.py manifest \
            --artifact-version "${{ needs.resolve.outputs.version }}" \
            --source-sha "${{ needs.resolve.outputs.source_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --published-at "$published_at" \
            --toolchain "emscripten-$(tr -d '[:space:]' < .emscripten-version)" \
            --output "$RUNNER_TEMP/interlis-release.json"
          node scripts/stage-release.mjs \
            --channel "${{ needs.resolve.outputs.channel }}" \
            --version "${{ needs.resolve.outputs.version }}" \
            --source-sha "${{ needs.resolve.outputs.source_sha }}" \
            --release-manifest "$RUNNER_TEMP/interlis-release.json" \
            --output build/release
          mkdir -p build/release/tarballs
          npm pack build/release/package --pack-destination build/release/tarballs >/dev/null
          node scripts/verify-release.mjs \
            --staging-root build/release \
            --expected-version "${{ needs.resolve.outputs.version }}" \
            --expected-source-sha "${{ needs.resolve.outputs.source_sha }}"
          git archive --format=tar.gz \
            --prefix="iox-cpp-${{ needs.resolve.outputs.version }}/" \
            -o build/release/iox-cpp-${{ needs.resolve.outputs.version }}-source.tar.gz \
            "${{ needs.resolve.outputs.source_sha }}"
          sha256sum build/release/tarballs/*.tgz build/release/*-source.tar.gz > build/release/SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: iox-release-${{ github.run_id }}
          path: |
            build/release/tarballs/*.tgz
            build/release/*-source.tar.gz
            build/release/SHA256SUMS
            build/release/interlis-release.json
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish @ilic/iox-wasm
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: iox-release-${{ github.run_id }}
          path: build/release
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.18.0
      - name: Publish immutable package version
        env:
          NPM_CONFIG_PROVENANCE: true
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
          NPM_TAG: ${{ needs.resolve.outputs.channel == 'stable' && 'latest' || 'snapshot' }}
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find build/release/tarballs -type f -name '*.tgz' -print -quit)
          package_name=$(tar -xOf "$tarball" package/package.json | jq -r .name)
          test "$(tar -xOf "$tarball" package/package.json | jq -r .gitHead)" = "$EXPECTED_SHA"
          tar -xOf "$tarball" package/interlis-release.json | jq -e \
            --arg version "$EXPECTED_VERSION" --arg sha "$EXPECTED_SHA" \
            '.artifactVersion == $version and .sourceSha == $sha' >/dev/null
          if npm view "$package_name@$EXPECTED_VERSION" version >/dev/null 2>&1; then
            test "$(npm view "$package_name@$EXPECTED_VERSION" gitHead)" = "$EXPECTED_SHA"
            echo "Already published $package_name@$EXPECTED_VERSION from $EXPECTED_SHA"
          else
            npm publish "$tarball" --access public --tag "$NPM_TAG"
          fi
          test "$(npm view "$package_name@$EXPECTED_VERSION" gitHead)" = "$EXPECTED_SHA"

  github-release:
    name: Publish GitHub release assets
    needs: [resolve, build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: iox-release-${{ github.run_id }}
          path: dist
      - name: Publish immutable stable or moving snapshot assets
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f -print | sort)
          (( ${#assets[@]} > 0 )) || { echo "No release assets found" >&2; exit 1; }
          if [[ "$CHANNEL" == stable ]]; then
            tag=$RELEASE_TAG
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Stable release $tag already exists; refusing to replace it" >&2
              exit 1
            fi
            gh release create "$tag" "${assets[@]}" --verify-tag --title "iox-cpp $tag" --latest
          else
            tag=snapshot
            if ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" refs/tags/snapshot >/dev/null 2>&1; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref=refs/tags/snapshot -f sha="$SOURCE_SHA" >/dev/null
            else
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/snapshot" \
                -f sha="$SOURCE_SHA" -F force=true >/dev/null
            fi
            if gh release view snapshot >/dev/null 2>&1; then
              gh release delete snapshot --yes --cleanup-tag=false
            fi
            gh release create snapshot "${assets[@]}" --prerelease --title "iox-cpp snapshot" \
              --notes "Moving snapshot built from $SOURCE_SHA (run $GITHUB_RUN_ID)."
          fi

  request-vcpkg-publication:
    name: Request native vcpkg publication
    needs: [resolve, build, publish-npm, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch immutable vcpkg release request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_KIND: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg release_kind "$RELEASE_KIND" \
            --arg release_tag "${RELEASE_TAG:-snapshot}" \
            '{event_type:"vcpkg-release-ready",client_payload:{source_sha:$source_sha,release_kind:$release_kind,release_tag:$release_tag,release_run_id:env.GITHUB_RUN_ID}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
