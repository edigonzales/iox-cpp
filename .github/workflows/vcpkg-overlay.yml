name: vcpkg overlay compatibility

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "source/**"
      - "test/consumer/**"
      - "vcpkg/**"
      - ".github/workflows/vcpkg-overlay.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  overlay:
    name: iox-cpp[ilic] (${{ matrix.triplet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      IOX_VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      ILIC_VERSION: 0.10.0-snapshot.475ecb2d
      VCPKG_BUILTIN_BASELINE: d015e31e90838a4c9dfa3eed45979bc70d9357fc
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_FEED_URL: https://nuget.pkg.github.com/edigonzales/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/edigonzales/index.json,read
      VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out iox-cpp
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg
          persist-credentials: false

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Mono for NuGet (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes mono-complete
          fi

      - name: Install Mono for NuGet (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            brew install mono
          fi

      - name: Prepare vcpkg downloads directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p "$VCPKG_DOWNLOADS"

      - name: Prepare vcpkg downloads directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: '"$IOX_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:IOX_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Resolve ilic registry baseline (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git ls-remote https://github.com/edigonzales/ilic-fork.git refs/heads/vcpkg-registry | awk '{print $1}')"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve ilic vcpkg registry baseline" >&2
            exit 1
          fi
          echo "ILIC_REGISTRY_BASELINE=$baseline" >> "$GITHUB_ENV"

      - name: Resolve ilic registry baseline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = git ls-remote https://github.com/edigonzales/ilic-fork.git refs/heads/vcpkg-registry
          $baseline = ($line -split '\s+')[0]
          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve ilic vcpkg registry baseline'
          }
          "ILIC_REGISTRY_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure overlay consumer manifest (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          manifest_root="$GITHUB_WORKSPACE/build/vcpkg-consumer"
          mkdir -p "$manifest_root"
          cat > "$manifest_root/vcpkg.json" <<EOF
          {
            "name": "iox-cpp-vcpkg-smoke",
            "version-string": "0",
            "dependencies": [
              {
                "name": "iox-cpp",
                "features": ["ilic"]
              }
            ],
            "overrides": [
              {
                "name": "ilic",
                "version-string": "$ILIC_VERSION"
              }
            ]
          }
          EOF
          cat > "$manifest_root/vcpkg-configuration.json" <<EOF
          {
            "default-registry": {
              "kind": "builtin",
              "baseline": "$VCPKG_BUILTIN_BASELINE"
            },
            "registries": [
              {
                "kind": "git",
                "repository": "https://github.com/edigonzales/ilic-fork.git",
                "reference": "vcpkg-registry",
                "baseline": "$ILIC_REGISTRY_BASELINE",
                "packages": ["ilic"]
              }
            ]
          }
          EOF

      - name: Configure overlay consumer manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-consumer'
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          $manifest = @{
            name = 'iox-cpp-vcpkg-smoke'
            'version-string' = '0'
            dependencies = @(
              @{
                name = 'iox-cpp'
                features = @('ilic')
              }
            )
            overrides = @(
              @{
                name = 'ilic'
                'version-string' = $env:ILIC_VERSION
              }
            )
          }
          $configuration = @{
            'default-registry' = @{
              kind = 'builtin'
              baseline = $env:VCPKG_BUILTIN_BASELINE
            }
            registries = @(
              @{
                kind = 'git'
                repository = 'https://github.com/edigonzales/ilic-fork.git'
                reference = 'vcpkg-registry'
                baseline = $env:ILIC_REGISTRY_BASELINE
                packages = @('ilic')
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $manifestRoot 'vcpkg.json')
          $configuration | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $manifestRoot 'vcpkg-configuration.json')

      - name: Authenticate GitHub Packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NUGET_PATH="$("$IOX_VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)"
          mono "$NUGET_PATH" sources add \
            -Source "$VCPKG_FEED_URL" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "$GITHUB_ACTOR" \
            -Password "$VCPKG_GITHUB_TOKEN"

      - name: Authenticate GitHub Packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nuget = (& "$env:IOX_VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:VCPKG_FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:GITHUB_ACTOR" `
            -Password "$env:VCPKG_GITHUB_TOKEN"

      - name: Install iox-cpp through overlay (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build/vcpkg-consumer"
          "$IOX_VCPKG_ROOT/vcpkg" install \
            --triplet "$VCPKG_TRIPLET" \
            --overlay-ports="$GITHUB_WORKSPACE/vcpkg/ports"

      - name: Install iox-cpp through overlay (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-consumer')
          try {
            & "$env:IOX_VCPKG_ROOT\vcpkg.exe" install `
              "--triplet=$env:VCPKG_TRIPLET" `
              "--overlay-ports=$env:GITHUB_WORKSPACE\vcpkg\ports"
          } finally {
            Pop-Location
          }

      - name: Configure clean vcpkg consumer
        run: >-
          cmake -S test/consumer/installed-package -B build/vcpkg-consumer-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.IOX_VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_MODE=OFF
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/vcpkg-consumer/vcpkg_installed
          -DIOX_CONSUMER_REQUIRE_ILIC=ON

      - name: Build vcpkg consumer
        run: cmake --build build/vcpkg-consumer-build --parallel

      - name: Run vcpkg consumer
        run: ctest --test-dir build/vcpkg-consumer-build --output-on-failure
